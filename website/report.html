<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="report.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;700&family=Open+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <title>Report-Page</title>
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <img src="assets/logo.png" alt="logo">
            </div>
            <div class="option">
                <p><a href="index.html" class="nav-link">HOME</a></p>
                <p><a href="verification.html" class="nav-link">VERIFY</a></p>
                <p><a href="#" class="nav-link active">REPORTS</a></p>
            </div>
            <div class="icons">
                <button><i class="fa-solid fa-gear"></i></button>
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
    </header>
    <main>
        <div class="block">
            <div class="container1">
                <h3>Project Details</h3>
                <div class="box"></div>
                <h3>Estimations</h3>
                <div class="box"></div>
            </div>
            <div class="container2">
                <h3>Verification Checklist</h3>
                <div class="checkbox">
                    <input type="checkbox">Data Consistency Check</input>
                </div>
                <div class="checkbox">
                    <input type="checkbox">Imagery Analysis</input>
                </div>
                <div class="checkbox">
                    <input type="checkbox">Field Visit Required</input>
                </div>
                <div class="dropdown">
                    <button class="dropbtn">Verification Outcome <span><i class="fa-solid fa-angle-down"></i></span></button>
                    <div class="dropdown-content">
                      <a href="#" data-value="rejected">Rejected</a>
                      <a href="#" data-value="approved">Approved</a>
                      <a href="#" data-value="in_review">In Review</a>
                      <a href="#" data-value="reupload">Send Back for Reupload</a>
                    </div>
                <div class="textarea">
                    <input type="textarea" placeholder="NCCR Reviewer Comment">
                </div>
                <div class="textarea">
                    <input type="textarea" placeholder="BCRs To Issue">
                </div>
                <div class="textarea">
                    <input id="project-id" type="text" placeholder="Project ID (e.g., PRJ_FLUTTER_001)">
                </div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <button id="verify-btn" disabled style="padding:10px 16px; border:none; border-radius:8px; background:#a1a1aa; color:white; cursor:not-allowed;">Verify</button>
                    <a id="check-carbons-btn" href="http://127.0.0.1:5002/" target="_blank" style="text-decoration:none; padding:10px 16px; border:none; border-radius:8px; background:#6d28d9; color:white; display:inline-block;">Check Carbons</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Function to load project data
        async function loadProjectData() {
            // Get project ID from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('projectId');

            // Always reflect projectId in the input if present
            const projectIdInput = document.getElementById('project-id');
            if (projectIdInput && projectId) {
                projectIdInput.value = projectId;
            }

            // Always update Check Carbons link if projectId present
            const checkCarbonsBtn = document.getElementById('check-carbons-btn');
            if (checkCarbonsBtn && projectId) {
                checkCarbonsBtn.href = `http://127.0.0.1:5002/?projectId=${projectId}`;
            }

            // Try to get project data from localStorage (works only if same origin)
            let project = null;
            try {
                const projectData = localStorage.getItem('currentProject');
                if (projectData) {
                    const parsed = JSON.parse(projectData);
                    // If localStorage has a different project, prefer URL projectId
                    if (!projectId || (parsed && parsed.projectId === projectId)) {
                        project = parsed;
                    }
                }
            } catch (e) {
                // ignore JSON/localStorage errors
            }

            // If no local project data and we have a projectId, fetch from backend API
            if (!project && projectId) {
                try {
                    const resp = await fetch(`http://127.0.0.1:5001/api/verification/project/${encodeURIComponent(projectId)}`);
                    if (resp.ok) {
                        const data = await resp.json();
                        if (data && data.success && data.data && data.data.project) {
                            const p = data.data.project;
                            // Normalize to the structure used in this page
                            project = {
                                projectId: p.projectId,
                                projectName: p.projectName || 'Unknown Project',
                                status: p.verificationStatus || 'pending',
                                ngo: (p.ngoId && (p.ngoId.organizationName || p.ngoId.contactEmail)) || 'Organization',
                                location: p.projectLocation || 'India',
                                carbonCredits: (p.mlAnalysis && p.mlAnalysis.carbonCreditsCalculated) || 0,
                                submissionDate: p.createdAt || new Date().toISOString()
                            };
                        }
                    }
                } catch (err) {
                    console.warn('Failed to fetch project from backend:', err);
                }
            }

            // Populate UI if we have project data
            if (project) {
                // Ensure the Project ID input is filled even if URL lacked projectId
                const projectIdInput2 = document.getElementById('project-id');
                if (projectIdInput2 && (!projectIdInput2.value || projectIdInput2.value.trim() === '')) {
                    projectIdInput2.value = project.projectId || '';
                }

                // Ensure Check Carbons link also uses the resolved projectId
                const checkBtn2 = document.getElementById('check-carbons-btn');
                if (checkBtn2 && project.projectId) {
                    checkBtn2.href = `http://127.0.0.1:5002/?projectId=${encodeURIComponent(project.projectId)}`;
                }
                const projectDetailsBox = document.querySelector('.container1 .box');
                if (projectDetailsBox) {
                    projectDetailsBox.innerHTML = `
                        <div class="project-info">
                            <h4>Project Information</h4>
                            <p><strong>Project ID:</strong> ${project.projectId}</p>
                            <p><strong>Project Name:</strong> ${project.projectName}</p>
                            <p><strong>Status:</strong> ${project.status}</p>
                            <p><strong>NGO:</strong> ${project.ngo}</p>
                            <p><strong>Location:</strong> ${project.location}</p>
                            <p><strong>Submission Date:</strong> ${new Date(project.submissionDate).toLocaleDateString()}</p>
                        </div>
                    `;
                }

                const estimationsBox = document.querySelectorAll('.container1 .box')[1];
                if (estimationsBox) {
                    estimationsBox.innerHTML = `
                        <div class="estimations-info">
                            <h4>Carbon Credit Estimations</h4>
                            <p><strong>Estimated Carbon Credits:</strong> ${project.carbonCredits} NCT</p>
                            <p><strong>CO2 Equivalent:</strong> ${(project.carbonCredits * 3994).toLocaleString()} tons</p>
                            <p><strong>Verification Status:</strong> <span class="status-badge">${project.status}</span></p>
                            <p><strong>Confidence Score:</strong> 85%</p>
                        </div>
                    `;
                }

                const verifyBtn = document.getElementById('verify-btn');
                if (verifyBtn) {
                    verifyBtn.disabled = false;
                    verifyBtn.style.background = '#10b981';
                    verifyBtn.style.cursor = 'pointer';
                }
                return;
            }

            // Fallback: show empty state
            const projectDetailsBox = document.querySelector('.container1 .box');
            if (projectDetailsBox) {
                projectDetailsBox.innerHTML = '<p class="no-data">No project data available. Please open this page via the DApp or the verification page so the projectId is included.</p>';
            }

            const estimationsBox = document.querySelectorAll('.container1 .box')[1];
            if (estimationsBox) {
                estimationsBox.innerHTML = '<p class="no-data">No estimation data available.</p>';
            }
        }

        // Dropdown functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Load project data when page loads
            loadProjectData();
            
            const dropdowns = document.querySelectorAll('.dropdown');
            const verifyBtn = document.getElementById('verify-btn');
            const projectIdInput = document.getElementById('project-id');
            let selectedOutcome = null;
            
            dropdowns.forEach(dropdown => {
                const dropbtn = dropdown.querySelector('.dropbtn');
                const dropdownContent = dropdown.querySelector('.dropdown-content');
                
                dropbtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    // Close all other dropdowns
                    dropdowns.forEach(otherDropdown => {
                        if (otherDropdown !== dropdown) {
                            otherDropdown.classList.remove('active');
                        }
                    });
                    
                    // Toggle current dropdown
                    dropdown.classList.toggle('active');
                });
                
                // Close dropdown when clicking on dropdown items
                const dropdownItems = dropdownContent.querySelectorAll('a');
                dropdownItems.forEach(item => {
                    item.addEventListener('click', function(e) {
                        e.preventDefault();
                        const value = this.getAttribute('data-value');
                        selectedOutcome = value;
                        // Set button label; if Approved, show green tick
                        if (value === 'approved') {
                            dropbtn.innerHTML = 'Approved ✅ <span><i class="fa-solid fa-angle-down"></i></span>';
                            verifyBtn.disabled = false;
                            verifyBtn.style.background = '#16a34a';
                            verifyBtn.style.cursor = 'pointer';
                        } else {
                            dropbtn.innerHTML = this.textContent + ' <span><i class="fa-solid fa-angle-down"></i></span>';
                            verifyBtn.disabled = true;
                            verifyBtn.style.background = '#a1a1aa';
                            verifyBtn.style.cursor = 'not-allowed';
                        }
                        dropdown.classList.remove('active');
                    });
                });
            });
            
            // Close dropdowns when clicking outside
            document.addEventListener('click', function() {
                dropdowns.forEach(dropdown => {
                    dropdown.classList.remove('active');
                });
            });

            // Verify button logic: only works when outcome is approved
            verifyBtn.addEventListener('click', async () => {
                if (verifyBtn.disabled) return;
                const projectId = (projectIdInput.value || '').trim();
                if (!projectId) {
                    alert('Please enter a Project ID (e.g., PRJ_FLUTTER_001)');
                    return;
                }

                try {
                    verifyBtn.textContent = 'Verifying...';
                    verifyBtn.disabled = true;
                    verifyBtn.style.background = '#a1a1aa';
                    // Determine approved credits if outcome is approved
                    let approvedCredits = 0;
                    try {
                      const ls = localStorage.getItem('currentProject');
                      if (ls) {
                        const p = JSON.parse(ls);
                        if (p && typeof p.carbonCredits === 'number') approvedCredits = p.carbonCredits;
                      }
                    } catch {}

                    const resp = await fetch(`http://127.0.0.1:5001/api/verification/project/${encodeURIComponent(projectId)}/verify`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'approved', comments: 'Approved via NCCR report page', approvedCarbonCredits: approvedCredits })
                    });
                    const data = await resp.json();
                    if (resp.ok && data.success) {
                        verifyBtn.textContent = 'Verified ✅';
                        verifyBtn.style.background = '#16a34a';
                        verifyBtn.disabled = true;
                    } else {
                        verifyBtn.textContent = 'Verify';
                        verifyBtn.disabled = false;
                        verifyBtn.style.background = '#16a34a';
                        alert(data.message || 'Verification failed');
                    }
                } catch (err) {
                    verifyBtn.textContent = 'Verify';
                    verifyBtn.disabled = false;
                    verifyBtn.style.background = '#16a34a';
                    alert('Network error while verifying: ' + err.message);
                }
            });
        });
    </script>
</body>

</html>
