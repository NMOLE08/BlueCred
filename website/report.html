<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="report.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;700&family=Open+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <title>Report-Page</title>
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <img src="assets/logo.png" alt="logo">
            </div>
            <div class="option">
                <p><a href="index.html" class="nav-link">HOME</a></p>
                <p><a href="verification.html" class="nav-link">VERIFY</a></p>
                <p><a href="#" class="nav-link active">REPORTS</a></p>
            </div>
            <div class="icons">
                <button><i class="fa-solid fa-gear"></i></button>
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
    </header>
    <main>
        <div class="block">
            <div class="container1">
                <h3>Project Details</h3>
                <div class="box"></div>
                <h3>Estimations</h3>
                <div class="box"></div>
            </div>
            <div class="container2">
                <h3>Verification Checklist</h3>
                <div class="checkbox">
                    <input type="checkbox">Data Consistency Check</input>
                </div>
                <div class="checkbox">
                    <input type="checkbox">Imagery Analysis</input>
                </div>
                <div class="checkbox">
                    <input type="checkbox">Field Visit Required</input>
                </div>
                <div class="dropdown">
                    <button class="dropbtn">Verification Outcome <span><i class="fa-solid fa-angle-down"></i></span></button>
                    <div class="dropdown-content">
                      <a href="#" data-value="rejected">Rejected</a>
                      <a href="#" data-value="approved">Approved</a>
                      <a href="#" data-value="in_review">In Review</a>
                      <a href="#" data-value="reupload">Send Back for Reupload</a>
                    </div>
                <div class="textarea">
                    <input type="textarea" placeholder="NCCR Reviewer Comment">
                </div>
                <div class="textarea">
                    <input type="textarea" placeholder="BCRs To Issue">
                </div>
                <div class="textarea">
                    <input id="project-id" type="text" placeholder="Project ID (e.g., PRJ_FLUTTER_001)">
                </div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <button id="verify-btn" disabled style="padding:10px 16px; border:none; border-radius:8px; background:#a1a1aa; color:white; cursor:not-allowed;">Verify</button>
                    <a id="check-carbons-btn" href="http://127.0.0.1:5002/" target="_blank" style="text-decoration:none; padding:10px 16px; border:none; border-radius:8px; background:#6d28d9; color:white; display:inline-block;">Check Carbons</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Dropdown functionality
        document.addEventListener('DOMContentLoaded', function() {
            const dropdowns = document.querySelectorAll('.dropdown');
            const verifyBtn = document.getElementById('verify-btn');
            const projectIdInput = document.getElementById('project-id');
            let selectedOutcome = null;
            
            dropdowns.forEach(dropdown => {
                const dropbtn = dropdown.querySelector('.dropbtn');
                const dropdownContent = dropdown.querySelector('.dropdown-content');
                
                dropbtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    // Close all other dropdowns
                    dropdowns.forEach(otherDropdown => {
                        if (otherDropdown !== dropdown) {
                            otherDropdown.classList.remove('active');
                        }
                    });
                    
                    // Toggle current dropdown
                    dropdown.classList.toggle('active');
                });
                
                // Close dropdown when clicking on dropdown items
                const dropdownItems = dropdownContent.querySelectorAll('a');
                dropdownItems.forEach(item => {
                    item.addEventListener('click', function(e) {
                        e.preventDefault();
                        const value = this.getAttribute('data-value');
                        selectedOutcome = value;
                        // Set button label; if Approved, show green tick
                        if (value === 'approved') {
                            dropbtn.innerHTML = 'Approved ✅ <span><i class="fa-solid fa-angle-down"></i></span>';
                            verifyBtn.disabled = false;
                            verifyBtn.style.background = '#16a34a';
                            verifyBtn.style.cursor = 'pointer';
                        } else {
                            dropbtn.innerHTML = this.textContent + ' <span><i class="fa-solid fa-angle-down"></i></span>';
                            verifyBtn.disabled = true;
                            verifyBtn.style.background = '#a1a1aa';
                            verifyBtn.style.cursor = 'not-allowed';
                        }
                        dropdown.classList.remove('active');
                    });
                });
            });
            
            // Close dropdowns when clicking outside
            document.addEventListener('click', function() {
                dropdowns.forEach(dropdown => {
                    dropdown.classList.remove('active');
                });
            });

            // Verify button logic: only works when outcome is approved
            verifyBtn.addEventListener('click', async () => {
                if (verifyBtn.disabled) return;
                const projectId = (projectIdInput.value || '').trim();
                if (!projectId) {
                    alert('Please enter a Project ID (e.g., PRJ_FLUTTER_001)');
                    return;
                }

                try {
                    verifyBtn.textContent = 'Verifying...';
                    verifyBtn.disabled = true;
                    verifyBtn.style.background = '#a1a1aa';
                    const resp = await fetch(`http://127.0.0.1:5001/api/verification/project/${encodeURIComponent(projectId)}/verify`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'approved', comments: 'Approved via NCCR report page', approvedCarbonCredits: 0 })
                    });
                    const data = await resp.json();
                    if (resp.ok && data.success) {
                        verifyBtn.textContent = 'Verified ✅';
                        verifyBtn.style.background = '#16a34a';
                        verifyBtn.disabled = true;
                    } else {
                        verifyBtn.textContent = 'Verify';
                        verifyBtn.disabled = false;
                        verifyBtn.style.background = '#16a34a';
                        alert(data.message || 'Verification failed');
                    }
                } catch (err) {
                    verifyBtn.textContent = 'Verify';
                    verifyBtn.disabled = false;
                    verifyBtn.style.background = '#16a34a';
                    alert('Network error while verifying: ' + err.message);
                }
            });
        });
    </script>
</body>

</html>
