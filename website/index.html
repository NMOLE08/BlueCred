<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <title>Home-Page</title>
</head>

<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <img src="assets/logo.png" alt="logo">
            </div>
            <div class="option">
                <p>HOME</p>
                <p>VERIFY</p>
                <p>REPORTS</p>
            </div>
            <div class="icons">
                <button><i class="fa-solid fa-gear"></i></button>
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>
    </header>
    <main>
        <div class="active_feed">
            <div class="white_box">
                <div class="topic"><p>TOTAL PROJECT</p></div>
                <div class="count"><p>3214</p></div>
            </div>
            <div class="white_box">
                <div class="topic"><p>PENDING VERIFICATION</p></div>
                <div class="count"><p class="unblanced">178</p></div>
            </div>
            <div class="blue_box">
                <div class="topic"><p>TOTAL BRCS ISSUED</p></div>
                <div class="count"><p>218746</p></div>
            </div>
            <div class="white_box">
                <div class="topic"><p>ACTIVE FIELD USER</p></div>
                <div class="count"><p>2723</p></div>
            </div>
        </div>
        <div class="block2">
            <div class="map">
                <img src="/website/assets/map.png" alt="map" >
            </div>
            <div class="alerts">
                <h3>RECENT ACTIVITIES AND ALERTS</h3>
                <p class="grey">“Project 1232 needs Urgent review”</p>
                <p class="white">“Project 1232 needs Urgent review”</p>
                <p class="grey">“Project 1232 needs Urgent review”</p>
                <p class="white">“Project 1232 needs Urgent review”</p>
            </div>
        </div>
    </main>
</body>

</html>
