# YOLO dataset configuration for mangrove detection
# Dataset path (relative to this file)
path: mangrove.v1i.yolov8

# Train and validation image directories (relative to 'path')
train: train/images
val: valid/images

# Number of classes
nc: 8

# Class names
names:
  0: class_0
  1: class_1
  2: class_2
  3: class_3
  4: class_4
  5: class_5
  6: class_6
  7: class_7
