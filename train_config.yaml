# Training configuration for YOLOv8 with class imbalance handling

# Data configuration
data: 'dataset/data_augmented.yaml'  # Using augmented dataset

# Model configuration
model: 'yolov8s.pt'  # Using small model for better performance

# Training parameters
device: 0  # 0 for GPU, 'cpu' for CPU
epochs: 200  # Increased for better convergence
patience: 50  # Increased patience for early stopping
time: None  # Training time in hours
batch: 32  # Increased batch size if GPU memory allows
imgsz: 640  # Image size
workers: 8  # Number of worker threads

# Optimizer
lr0: 0.01  # Initial learning rate
lrf: 0.1  # Final OneCycleLR learning rate
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss function
loss: 'focal'  # Using focal loss for class imbalance
label_smoothing: 0.1

# Data augmentation
augment: True
hsv_h: 0.015  # Image HSV-Hue augmentation
hsv_s: 0.7    # Image HSV-Saturation augmentation
hsv_v: 0.4    # Image HSV-Value augmentation
degrees: 10.0  # Rotation
translate: 0.1  # Translation
scale: 0.5     # Scale
shear: 0.0     # Shear
perspective: 0.0
flipud: 0.0    # Flip Up-Down
fliplr: 0.5    # Flip Left-Right
mosiac: 1.0    # Mosaic augmentation
mixup: 0.1     # MixUp augmentation
copy_paste: 0.0  # Copy-Paste augmentation

# Class weights
class_weights: True  # Enable class weighting

# Validation
val: True  # Validate during training
save_json: True  # Save JSON results
save_hybrid: False  # Save hybrid version of labels
conf: 0.001  # Confidence threshold
iou: 0.6  # NMS IoU threshold

# Logging
project: 'mangrove_detection'
name: 'improved_training'
exist_ok: True  # Overwrite existing project/name
verbose: True

# Checkpoints
save_period: -1  # Save checkpoint every x epochs
cache: False  # Cache images for faster training

# Additional settings
single_cls: False  # Train as single-class dataset
cos_lr: True  # Use cosine learning rate scheduler
close_mosaic: 10  # Disable mosaic for last 10 epochs
overlap_mask: True  # Overlap masks during training (for segmentation)

# Monitoring
plots: True  # Save plots during training
bbox_interval: -1  # Set to -1 to disable bbox plots

# Export
export:  # Export after training (optional)
  format: 'onnx'
  dynamic: True
