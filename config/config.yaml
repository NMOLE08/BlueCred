data:
  root_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  annotations_dir: "data/annotations"
  image_size: 256  # Reduced from 512 to speed up training
  num_classes: 2  # Background and blue carbon vegetation
  train_val_split: 0.8
  batch_size: 2  # Increased batch size since we're using fewer samples
  num_workers: 0  # Increased to speed up data loading

model:
  name: "unet"
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1  # Binary segmentation (sigmoid output)

optimizer:
  lr: 0.0005  # Slightly reduced learning rate for stability with smaller batch size
  weight_decay: 0.0001

scheduler:
  factor: 0.1
  patience: 5
  min_lr: 1e-6

training:
  max_epochs: 5  # Reduced to 5 epochs for testing
  device: "cpu"  # Will be set to 'cuda' if available, otherwise 'cpu' in the code
  save_dir: "models"
  experiment_name: "blue_carbon_segmentation"
  log_dir: "logs"
