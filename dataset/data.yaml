# Dataset configuration for mangrove tree detection
path: d:/object-detection/dataset  # dataset root directory
train: images/train  # training images (relative to path)
val: images/val      # validation images (relative to path)
test: images/val     # test images (optional)

# Number of classes
nc: 8

# Class names
names: [
    'class_0',
    'class_1',
    'class_2',
    'class_3',
    'class_4',
    'class_5',
    'class_6',
    'class_7'
]

